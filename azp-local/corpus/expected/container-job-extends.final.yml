trigger:
  branches:
    include:
      - main
variables:
  CGO_ENABLED: "0"
  governed: "true"
jobs:
  - job: build
    displayName: Build in golang:1.24-alpine
    pool:
      vmImage: ubuntu-24.04
    container: golang:1.24-alpine
    variables:
      support: current
    steps:
      - checkout: self
        fetchDepth: 1
      - script: echo "Support level $(support), 2 build steps"
        displayName: Report
      - script: go build ./...
        displayName: Build
      - script: go test ./... -count=1
        displayName: Test
      - script: echo "ran Test"
        displayName: After test
        condition: always()
