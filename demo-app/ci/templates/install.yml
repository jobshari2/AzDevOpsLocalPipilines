# Steps: select a Node version, restore the npm cache and install dependencies.
parameters:
  - name: nodeVersion
    type: string
    default: 22.x

steps:
  - task: UseNode@1
    displayName: Use Node ${{ parameters.nodeVersion }}
    inputs:
      version: ${{ parameters.nodeVersion }}
  - task: Cache@2
    displayName: Cache npm
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)
  - script: npm ci
    displayName: Install dependencies
